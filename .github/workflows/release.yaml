name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  archive:
    name: Attach the component archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest_version=$(jq -r .version custom_components/room_valve_control/manifest.json)
          if [[ "${TAG#v}" != "$manifest_version" ]]; then
            echo "::error::Tag $TAG does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Build the archive
        run: ./run archive

      - name: Upload the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/room_valve_control.zip --clobber --repo "$GITHUB_REPOSITORY"
